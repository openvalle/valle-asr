[package]
name = "valle-asr"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Cross-platform local speech recognition with pluggable models and word timestamps"
repository = "https://github.com/openvalle/valle-asr"
homepage = "https://github.com/openvalle/valle-asr"
documentation = "https://docs.rs/valle-asr"
readme = "README.md"
keywords = ["speech", "asr", "qwen", "transcription", "timestamps"]
categories = ["multimedia::audio"]
include = ["src/**", "tests/**", "third_party/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "THIRD_PARTY.md", "models.json"]

[package.metadata.docs.rs]
no-default-features = true
features = ["qwen3", "download"]
targets = ["x86_64-unknown-linux-gnu"]

[[bin]]
name = "valle-asr"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["qwen3", "download", "cli"]
cli = ["dep:clap", "dep:tempfile", "qwen3", "download"]
qwen3 = ["dep:candle-core", "dep:candle-nn", "dep:memmap2", "dep:safetensors", "dep:tokenizers"]
download = ["dep:ureq", "dep:ring"]

[dependencies]
anyhow = "1.0.105"
candle-core = { version = "0.11.1", default-features = false, optional = true }
candle-nn = { version = "0.11.1", default-features = false, optional = true }
memmap2 = { version = "0.9.12", optional = true }
safetensors = { version = "0.8.0", optional = true }
clap = { version = "4.6.9", features = ["derive"], optional = true }
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"], optional = true }
ring = { version = "0.17.14", optional = true }
tempfile = { version = "3.27.0", optional = true }

# Apple's Accelerate framework runs the CPU matrix products on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.1", default-features = false, features = ["accelerate"], optional = true }
candle-nn = { version = "0.11.1", default-features = false, features = ["accelerate"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"

[profile.dev]
debug = 0

[profile.test]
opt-level = 2
debug = 0

[profile.dev.package."*"]
opt-level = 2
