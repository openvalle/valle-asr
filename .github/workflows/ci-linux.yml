name: Linux x86_64 ASR
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-x86_64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RAYON_NUM_THREADS: 4
      TOKENIZERS_PARALLELISM: 'false'
      VALLE_ASR_TEST_CACHE: models
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install native Rust toolchain
        run: |
          rustup toolchain install 1.99.0-x86_64-unknown-linux-gnu --profile minimal --component rustfmt --component clippy
          rustup override set 1.99.0-x86_64-unknown-linux-gnu
      - name: Verify native runner architecture
        run: python scripts/check_ci_host.py x86_64-unknown-linux-gnu '${{ runner.arch }}'
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: linux-rust-1.99
          cache-workspace-crates: true
          cache-on-failure: true
      - name: Release guard tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Check optional backend boundary
        run: cargo test --locked --no-default-features
      - name: Feature combinations
        run: |
          cargo check --locked --no-default-features --features download --all-targets
          cargo check --locked --no-default-features --features qwen3 --all-targets
          cargo check --locked --no-default-features --features qwen3,download --all-targets
      - name: Public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-default-features --features qwen3,download --no-deps --lib
      - name: Verify publishable crate archive
        run: cargo publish --locked --dry-run
      # Publish dry-run validates a temporary archive. Retain the same
      # clean sources for review after the full verification succeeds.
      - name: Retain verified crate archive
        run: cargo package --locked --no-verify
      - name: Upload verified crate archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-x86_64-valle-asr-crate
          path: target/package/valle-asr-*.crate
          if-no-files-found: error
          retention-days: 14
      - name: Permissive dependency licenses
        run: python scripts/check_licenses.py
      - name: Unit and API tests
        run: cargo test --locked --release
      - name: Restore pinned model cache
        uses: actions/cache@v6.1.0
        with:
          path: models
          enableCrossOsArchive: true
          key: qwen3-models-v1-${{ hashFiles('models.json') }}
      - name: Download or verify model cache
        run: cargo run --locked --release -- download --cache-dir models
      - name: Real English, Chinese, long files and word alignment
        run: cargo test --locked --release --test real_models -- --ignored --nocapture
      - name: Upload recognition results and validation receipt
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-x86_64-qwen3-results
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Exclude package staging from the build cache
        if: always()
        run: python -c "import shutil; shutil.rmtree('target/package', ignore_errors=True)"
